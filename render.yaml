services:
  - type: web
    name: biblo-bookstore-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard to your Neon connection string
